<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Şarkı Seçicim</title>
<style>
/* v5 (26 Kas): radyo arşivi / plak rafı. Beyaz arşiv fişi + gri sekme, bordo plak etiketi, serif ad. Dış yazı tipi yok (telefonun kendi yazısı). */
:root{
  --kagit:#ffffff; --yaprak:#eff1f4; --mur:#16181c; --ikincil:#464b55; --cizgi:#c9ccd2; --cizgi-koyu:#868c96;
  --bordo:#8c1d1d; --bordo-metin:#ffffff; --secili:#f7e1e1; --wa:#13663a; --wa-metin:#ffffff;
  --uyari:#fff0c9; --serif:"Noto Serif","Droid Serif",Georgia,"Times New Roman",serif;
  --sans:Roboto,"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --yan:max(16px, env(safe-area-inset-left)); --yan-sag:max(16px, env(safe-area-inset-right));
  color-scheme: light;
}
[data-theme="dark"]{
  --kagit:#15171a; --yaprak:#22252a; --mur:#f2f3f5; --ikincil:#c9cdd4; --cizgi:#3c4048; --cizgi-koyu:#6b717c;
  --bordo:#f0a48f; --bordo-metin:#1b0d08; --secili:#4a2620; --wa:#5fd08f; --wa-metin:#08200f; --uyari:#3d3216;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--kagit);color:var(--mur);font-family:var(--sans);font-size:20px;line-height:1.45;overflow-x:hidden}
button,input,a{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--bordo);outline-offset:2px}

/* üst şerit: radyo arşivi etiketi */
.ust{position:sticky;top:0;z-index:5;background:var(--kagit);padding:10px var(--yan-sag) 12px var(--yan);border-bottom:3px double var(--cizgi-koyu)}
.ust-satir{display:flex;align-items:center;gap:10px;min-height:52px}
.geri{min-height:52px;min-width:52px;padding:0 14px;border-radius:6px;border:2px solid var(--mur);background:var(--yaprak);
  font-weight:700;font-size:20px;cursor:pointer;flex-shrink:0}
h1{font-family:var(--serif);font-size:25px;margin:0;font-weight:700;line-height:1.2;overflow-wrap:anywhere;min-width:0}
.ara{margin-top:10px;position:relative}
.ara input{width:100%;min-height:58px;border-radius:6px;border:2px solid var(--mur);background:var(--yaprak);padding:0 14px;font-size:20px;
  -webkit-appearance:none;appearance:none}
.ara input::placeholder{color:var(--ikincil);opacity:1}
main{padding:6px var(--yan-sag) 170px var(--yan);max-width:720px;margin:0 auto}
.giris{font-size:20px;color:var(--ikincil);margin:12px 0 4px}

/* bölüm başlığı: arşiv rafı etiketi */
.raf{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;font-family:var(--serif);font-size:22px;font-weight:700}
.raf::after{content:"";flex:1;border-bottom:1px solid var(--cizgi-koyu);transform:translateY(-6px)}
.raf small{font-family:var(--sans);font-size:19px;font-weight:500;color:var(--ikincil)}

/* harf dizini: kartoteks sekmeleri */
.harfler{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.harf{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px;border:2px solid var(--mur);
  border-radius:6px 6px 2px 2px;background:var(--yaprak);font-family:var(--serif);font-size:27px;font-weight:700;line-height:1;
  text-decoration:none;cursor:pointer;box-shadow:0 3px 0 var(--cizgi)}
.harf.diger{font-family:var(--sans);font-size:19px;font-weight:700}
.harf:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cizgi)}

/* defter çizgili liste */
.liste{margin:0;padding:0;list-style:none;border-top:1px solid var(--cizgi)}
.sanatci{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 4px;border-bottom:1px solid var(--cizgi);
  text-decoration:none;cursor:pointer}
.sanatci:active{background:var(--yaprak)}
.sanatci .ad{display:block;font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.sanatci .alt{display:block;font-size:19px;color:var(--ikincil)}
.sanatci .metin{flex:1;min-width:0}
.ok{font-size:28px;line-height:1;flex-shrink:0;color:var(--ikincil)}
.rozet{background:var(--bordo);color:var(--bordo-metin);border-radius:4px;padding:2px 10px;font-weight:700;font-size:19px;flex-shrink:0}

.btn{display:block;width:100%;min-height:58px;border-radius:6px;border:2px solid var(--mur);background:var(--yaprak);font-weight:700;font-size:20px;
  padding:8px 16px;cursor:pointer;margin:12px 0;text-align:center;text-decoration:none}
.btn.dolu{background:var(--bordo);border-color:var(--bordo);color:var(--bordo-metin)}
.btn.uyari{border-color:var(--bordo);color:var(--bordo)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-metin);display:flex;align-items:center;justify-content:center;min-height:76px;font-size:23px}
.btn.kopya{min-height:70px;font-size:22px}

/* şarkı satırı: işaretlenen fiş */
.satir{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 6px;border-bottom:1px solid var(--cizgi);cursor:pointer}
.satir.secili{background:var(--secili)}
.satir input{position:absolute;opacity:0;width:1px;height:1px}
.kutu{width:40px;height:40px;border-radius:4px;border:3px solid var(--mur);flex-shrink:0;display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--bordo-metin);background:var(--yaprak)}
.satir.secili .kutu{background:var(--bordo);border-color:var(--bordo)}
.satir .ad{font-weight:700;font-size:20px;overflow-wrap:anywhere}
.satir .alt{display:block;color:var(--ikincil);font-size:19px;font-weight:400}
.cikar{margin-left:auto;min-height:52px;min-width:52px;border-radius:6px;border:2px solid var(--bordo);background:var(--yaprak);color:var(--bordo);font-weight:700;font-size:19px;cursor:pointer;padding:0 12px;flex-shrink:0}

.alt-cubuk{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--kagit);border-top:3px double var(--cizgi-koyu);
  padding:10px var(--yan-sag) max(10px, env(safe-area-inset-bottom)) var(--yan)}
.alt-cubuk .btn{max-width:720px;margin:0 auto;min-height:62px;font-size:22px}
.geri-al{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));z-index:7;padding:0 var(--yan-sag) 0 var(--yan)}
.geri-al div{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-radius:6px;
  background:#24272c;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.geri-al span{flex:1;font-size:20px;font-weight:700}
.geri-al button{min-height:52px;min-width:96px;border-radius:6px;border:2px solid #fff;background:#fff;color:#1e1812;font-weight:700;font-size:20px;cursor:pointer}
.bilgi{padding:14px 16px;border-radius:6px;background:var(--yaprak);border:1px solid var(--cizgi);margin:10px 0;font-size:20px}
.bilgi.uyari{background:var(--uyari);border:2px solid var(--bordo)}
.yukleniyor{padding:30px 0;text-align:center;font-weight:700;color:var(--ikincil)}
textarea{width:100%;min-height:200px;font-size:20px;border-radius:6px;border:2px solid var(--mur);background:var(--yaprak);color:var(--mur);padding:10px}
.bos{color:var(--ikincil);padding:16px 0}
.sayi{font-family:var(--serif);font-size:30px;font-weight:700;margin:12px 0 0;line-height:1.2}
.onizleme{margin:10px 0;padding:12px 14px;border-radius:6px;background:var(--yaprak);border:1px solid var(--cizgi)}
.onizleme div{padding:4px 0;font-weight:700;overflow-wrap:anywhere}
.adim{padding:14px 16px;border-radius:6px;border:2px solid var(--cizgi-koyu);background:var(--yaprak);margin:12px 0}
.adim.aktif{border-color:var(--wa)}
.adim.bitti{background:var(--secili);border-color:var(--bordo)}
.adim h3{margin:0 0 6px;font-size:22px}
.tarif{font-weight:700;margin:6px 0 4px}
.durum{margin:10px 0;color:var(--ikincil)}
.grup-baslik{font-family:var(--serif);font-size:21px;font-weight:700;margin:22px 0 8px}
.tema{display:flex;gap:10px;margin:8px 0}
.tema button{flex:1;min-height:56px;border-radius:6px;border:2px solid var(--mur);background:var(--yaprak);font-weight:700;font-size:20px;cursor:pointer}
.tema button[aria-pressed="true"]{background:var(--mur);color:var(--kagit)}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<header class="ust">
  <div class="ust-satir">
    <button class="geri" id="geri" type="button" hidden aria-label="Geri dön">‹ Geri</button>
    <h1 id="baslik">Şarkı Seçicim</h1>
  </div>
  <div class="ara" id="araKutu">
    <input id="ara" type="search" inputmode="search" autocomplete="off" placeholder="Sanatçı ya da şarkı adı yazın" aria-label="Sanatçı ya da şarkı ara">
  </div>
</header>
<main id="ekran" aria-live="polite"></main>
<div class="geri-al" id="geriAlKutu" hidden><div role="status"><span id="geriAlMetin"></span><button type="button" id="geriAlBtn">Geri al</button></div></div>
<div class="alt-cubuk" id="altCubuk" hidden><button class="btn dolu" id="secilenBtn" type="button">Listemi gör (0)</button></div>
<script>
(function(){
"use strict";
var ANAHTAR="sarkiSecimV4", GONDER="sarkiGonderV4", TEMA="sarkiTemaV5";                /* seçim anahtarları v4 ile AYNI (halanın seçimi kalır) */
var KISAYOL=["d97013","d174210","d13758","d9289","d113766","d254617"];                       /* Zeki Müren, Müzeyyen Senar, Barış Manço, Sezen Aksu, Orhan Gencebay, İbrahim Tatlıses */
var DIGER=["d16628","d103304","d343785","d99563","d97092","d111965","d6435","d328791","d101725","d3254","d459471","d98753",
           "d4308","d328865","d91607","d16617","d325135","d343782","d101809","d343662","d97973","d96908","d9290","d98036"];
var HARFLER=["A","B","C","Ç","D","E","F","G","Ğ","H","I","İ","J","K","L","M","N","O","Ö","P","R","S","Ş","T","U","Ü","V","Y","Z"];
var HARF_KOD={"Ç":"c2","Ğ":"g2","I":"i1","İ":"i2","Ö":"o2","Ş":"s2","Ü":"u2"};
var ILK=20, ARTIM=20, ONIZLEME=8, HARF_ILK=40, HARF_ARTIM=60;
var D=null, dosyalar={}, yukleniyor={}, sec={}, aramaMetni="", yigin=0, kayitTamam=true;
var gonderDurum={}, kon={}, aktifHash=null, gosterilen={}, harfGoster={}, aLim=12, sLim=20;
var geriCagri=[];
var ekran=document.getElementById("ekran"), baslik=document.getElementById("baslik"),
    geri=document.getElementById("geri"), ara=document.getElementById("ara"), secBtn=document.getElementById("secilenBtn"),
    altCubuk=document.getElementById("altCubuk"), araKutu=document.getElementById("araKutu"), geriAlKutu=document.getElementById("geriAlKutu"),
    geriAlMetin=document.getElementById("geriAlMetin"), geriAlBtn=document.getElementById("geriAlBtn");
try{ history.scrollRestoration="manual"; }catch(e){}

/* ---------- tema: varsayılan açık kâğıt; seçim telefonda kalır ---------- */
function temaUygula(t){ document.documentElement.setAttribute("data-theme", t==="dark"?"dark":"light");
  var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", t==="dark"?"#15171a":"#ffffff"); }
var tema="light"; try{ tema=localStorage.getItem(TEMA)==="dark"? "dark":"light"; }catch(e){}
temaUygula(tema);

function kayitOku(k){ try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return v && typeof v==="object" && !Array.isArray(v)? v : null; }catch(e){ return null; } }
sec=kayitOku(ANAHTAR)||{};
try{ gonderDurum=JSON.parse(localStorage.getItem(GONDER)||"{}")||{}; }catch(e){ gonderDurum={}; }
function kaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify(sec)); kayitTamam=true; }catch(e){ kayitTamam=false; }
  sayac();
}
function gonderKaydet(){ try{ localStorage.setItem(GONDER, JSON.stringify(gonderDurum)); }catch(e){} }
function adet(){ return Object.keys(sec).length; }
function mevcutHash(){ return (location.hash||"").slice(1); }
function sayac(){
  var n=adet(), hs=mevcutHash();
  araKutu.hidden=(hs==="secilenler");
  secBtn.classList.toggle("dolu", hs!=="secilenler");
  if(hs==="secilenler"){ secBtn.textContent="‹ Seçmeye devam et"; altCubuk.hidden=false; }
  else{ secBtn.textContent="Listemi gör ("+n+")"; altCubuk.hidden=!n; }
}
function h(tag, p, cocuk){
  var e=document.createElement(tag);
  if(p) for(var k in p){ if(k==="text") e.textContent=p[k]; else if(k==="on") for(var ev in p.on) e.addEventListener(ev,p.on[ev]); else e.setAttribute(k,p[k]); }
  (cocuk||[]).forEach(function(c){ if(c!=null) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}
function katla(s){
  return (s||"").normalize("NFC").replace(/İ/g,"i").replace(/I/g,"ı").toLowerCase()
    .replace(/ı/g,"i").replace(/i̇/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c")
    .replace(/[âàáä]/g,"a").replace(/[îíï]/g,"i").replace(/[ûúù]/g,"u").replace(/[êéèë]/g,"e").replace(/[óò]/g,"o")
    .replace(/[^0-9a-z]+/g," ").trim();
}
function git(hash){ delete kon[hash]; if(location.hash!=="#"+hash){ yigin++; location.hash=hash; } else ciz(); }
function b36(n){ return n.toString(36); }
function pad2(s){ return s.length<2? "0"+s : s; }
function fnv(metin){
  var b=new TextEncoder().encode(metin), x=0x811c9dc5;
  for(var i=0;i<b.length;i++){ x^=b[i]; x=Math.imul(x,0x01000193)>>>0; }
  return x.toString(36);
}

function jsonAl(yol, depo, anahtar){
  if(depo[anahtar]) return Promise.resolve(depo[anahtar]);
  var y="y:"+yol; if(yukleniyor[y]) return yukleniyor[y];
  yukleniyor[y]=fetch(yol).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){ depo[anahtar]=j; delete yukleniyor[y]; return j; })
    .catch(function(e){ delete yukleniyor[y]; throw e; });
  return yukleniyor[y];
}
function sanatciDosya(sid){ return jsonAl("veri/s/"+sid+".json", dosyalar, sid); }
var araParca={};
function araDosya(on){
  var k=D.ap&&D.ap[on]; if(!k) return jsonAl("veri/a/"+on+".json", araParca, on);
  if(araParca[on]) return Promise.resolve(araParca[on]);
  var tmp={}, l=[]; for(var i=0;i<k;i++) l.push(jsonAl("veri/a/"+on+"."+i+".json", tmp, i));
  return Promise.all(l).then(function(p){ araParca[on]=[].concat.apply([],p); return araParca[on]; }); }
function sanatciSarki(sid){ return dosyalar[sid]||null; }
function genislik(sid){ var a=D.sanatcilar[sid]; return a && a.n>1296? 3:2; }
function seciliSay(sid){ var n=0; for(var k in sec) if(sec[k][0]===sid) n++; return n; }

function ust(b, geriGoster){ baslik.textContent=b; geri.hidden=!geriGoster; document.title=geriGoster? b+" · Şarkı Seçicim":"Şarkı Seçicim"; }
function temizle(){ ekran.textContent=""; geriCagri=[]; }
function yenile(){ geriCagri.forEach(function(f){ f(); }); if(mevcutHash()==="secilenler") secilenEkran(true); sayac(); }

/* ---------- geri al çubuğu ---------- */
var undoZaman=null, undoSnap=null;
function undoKapat(){ geriAlKutu.hidden=true; undoSnap=null; clearTimeout(undoZaman); }
function degistir(fn, metin){
  var once=JSON.stringify(sec);
  fn(); kaydet();
  if(metin){ undoSnap=once; geriAlMetin.textContent=metin; geriAlKutu.hidden=false; clearTimeout(undoZaman); undoZaman=setTimeout(undoKapat,8000); }
  yenile();
}
geriAlBtn.addEventListener("click",function(){
  if(undoSnap===null) return;
  try{ sec=JSON.parse(undoSnap); }catch(e){}
  kaydet(); undoKapat(); yenile();
});

/* ---------- sevilen sırası ve harf dizini ---------- */
function harfi(ad){                                  /* Türk alfabesine göre ilk harf; Q W X, rakam ve öteki "Diğer" */
  var m=(ad||"").normalize("NFC").replace(/^[^0-9A-Za-zÀ-ɏ]+/,"");
  if(!m) return "#";
  var c=m.charAt(0); if(m.charAt(1)==="̇" && (c==="I"||c==="i")) return "İ";
  var u=c.toLocaleUpperCase("tr-TR");
  if(HARFLER.indexOf(u)>=0) return u;
  var t=u.normalize("NFD").charAt(0);
  if(t==="I") return c==="Î"||c==="î"||c==="Í"||c==="í"? "İ" : "I";
  return HARFLER.indexOf(t)>=0? t : "#";
}
function harfKod(hf){ return hf==="#"? "diger" : (HARF_KOD[hf]||hf.toLowerCase()); }
function koddanHarf(k){ if(k==="diger") return "#"; for(var hf in HARF_KOD) if(HARF_KOD[hf]===k) return hf; var u=k.toUpperCase(); return HARFLER.indexOf(u)>=0? u : null; }
function harfAdi(hf){ return hf==="#"? "Diğer (Q, W, X, rakam)" : hf; }
function puanla(){                                    /* sevilen önce: halanın 30'u, sonra tür listesindeki sıra, sonra şarkı sayısı */
  D.puan={};
  KISAYOL.concat(DIGER).forEach(function(sid,i){ D.puan[sid]=i; });
  var sidler=Object.keys(D.sanatcilar);
  sidler.sort(function(x,y){
    var px=x in D.puan? D.puan[x] : 1e6, py=y in D.puan? D.puan[y] : 1e6; if(px!==py) return px-py;
    var sx=x in D.sira? D.sira[x] : 1e5, sy=y in D.sira? D.sira[y] : 1e5; if(sx!==sy) return sx-sy;
    return (D.sanatcilar[y].n||0)-(D.sanatcilar[x].n||0);
  });
  D.sevilen=sidler; D.harf={}; D.sirano={};
  sidler.forEach(function(sid,i){ D.sirano[sid]=i; var hf=harfi(D.sanatcilar[sid].ad); (D.harf[hf]||(D.harf[hf]=[])).push(sid); });
}

/* ---------- ana ekran ---------- */
function sanatciKart(sid){
  var a=D.sanatcilar[sid]; if(!a) return null;
  var n=seciliSay(sid);
  return h("a",{class:"sanatci",href:"#sanatci-"+sid,on:{click:function(e){e.preventDefault();git("sanatci-"+sid);}}},[
    h("span",{class:"metin"},[h("span",{class:"ad",text:a.ad}),h("span",{class:"alt",text:a.n? a.n+" şarkı":"Şarkı listesi bulunamadı"})]),
    n? h("span",{class:"rozet","aria-label":n+" şarkı seçili",text:String(n)}) : h("span",{class:"ok","aria-hidden":"true",text:"›"})
  ]);
}
function liste(sidler){ var ul=h("div",{class:"liste"}); sidler.forEach(function(sid){ var k=sanatciKart(sid); if(k) ul.appendChild(k); }); return ul; }
function harfDizini(){
  var g=h("div",{class:"harfler",role:"list"});
  HARFLER.concat(["#"]).forEach(function(hf){
    g.appendChild(h("a",{class:"harf"+(hf==="#"?" diger":""),role:"listitem",href:"#harf-"+harfKod(hf),"aria-label":(hf==="#"?"Diğer":hf)+" harfi, "+(D.harf[hf]||[]).length+" sanatçı",
      text:hf==="#"?"Diğer":hf,on:{click:function(e){ e.preventDefault(); git("harf-"+harfKod(hf)); }}}));
  });
  return g;
}
function anaEkran(){
  ust("Şarkı Seçicim", false); temizle();
  ekran.appendChild(h("p",{class:"giris",text:"Sanatçının baş harfine dokunun ya da adını yukarıya yazın."}));
  ekran.appendChild(h("h2",{class:"raf"},["Harfle bulun ",h("small",{text:Object.keys(D.sanatcilar).length.toLocaleString("tr-TR")+" sanatçı"})]));
  ekran.appendChild(harfDizini());
  ekran.appendChild(h("h2",{class:"raf",text:"En sevilenler"}));
  ekran.appendChild(liste(KISAYOL.concat(DIGER)));
  ekran.appendChild(h("a",{class:"btn",href:"#turler",text:"Müzik türlerine göz at ›",on:{click:function(e){ e.preventDefault(); git("turler"); }}}));
  ekran.appendChild(h("h2",{class:"raf",text:"Ekran rengi"}));
  var tm=h("div",{class:"tema",role:"group","aria-label":"Ekran rengi"});
  [["light","Açık"],["dark","Koyu"]].forEach(function(x){
    tm.appendChild(h("button",{type:"button","aria-pressed":tema===x[0]?"true":"false",text:x[1],on:{click:function(){
      tema=x[0]; try{ localStorage.setItem(TEMA,tema); }catch(e){} temaUygula(tema);
      Array.prototype.forEach.call(tm.children,function(b){ b.setAttribute("aria-pressed", b.textContent===x[1]?"true":"false"); }); }}}));
  });
  ekran.appendChild(tm);
}
function harfEkran(kod){
  var hf=koddanHarf(kod);
  if(hf===null) return anaEkran();

/* ---------- arama: Türkçe harf ve büyük/küçük harf duyarsız; tam eşleşme yoksa tek harf hatası toleransı ---------- */
function uzaklik(a,b,sinir){                         /* Damerau-Levenshtein (komşu yer değiştirme dahil), sınır aşılınca erken çıkar */
  if(Math.abs(a.length-b.length)>sinir) return sinir+1;
  var o2=null, o=[], s=[], i, j;
  for(j=0;j<=b.length;j++) o[j]=j;
  for(i=1;i<=a.length;i++){
    s=[i]; var en=i;
    for(j=1;j<=b.length;j++){
      var m=a.charAt(i-1)===b.charAt(j-1)?0:1;
      var v=Math.min(o[j]+1, s[j-1]+1, o[j-1]+m);
      if(o2 && i>1 && j>1 && a.charAt(i-1)===b.charAt(j-2) && a.charAt(i-2)===b.charAt(j-1)) v=Math.min(v,o2[j-2]+1);
      s[j]=v; if(v<en) en=v;
    }
    if(en>sinir) return sinir+1;
    o2=o; o=s;
  }
  return o[b.length];
}
function bitisik(k,ql){                              /* "zekimuren" → "zeki muren": eşleşme bir kelimenin başından başlamalı ("saz ekibi" içinde "zeki" sayılmaz) */

  var tk=q.split(" ").filter(Boolean), tam=[], ql=q.replace(/ /g,"");
  for(var sid in D.sanatcilar){

    var uy=ks.indexOf(" "+q)>=0 || tk.every(function(t){ return ks.indexOf(" "+t)>=0; }) || (tk.length===1 && q.length>=3 && bitisik(k,ql));
    if(uy) tam.push([k===q?0:(k.indexOf(q)===0?1:2), sid]);
  }
  if(tam.length || q.length<3) return tam.sort(function(x,y){ return x[0]-y[0] || D.sirano[x[1]]-D.sirano[y[1]]; }).map(function(x){ return x[1]; });
  var bul=[], uzun=tk.filter(function(t){ return t.length>=3; });
  if(!uzun.length) return [];
  for(var s2 in D.sanatcilar){
    var adT=D.kat[s2].split(" "), top=0, olur=true;
    for(var i=0;i<tk.length && olur;i++){
      var t=tk[i], sn=t.length>=8?2:1, en=sn+1;

      for(var j=0;j<adT.length;j++){

        if(d<en) en=d;

    }
    if(olur) bul.push([top,s2]);
  }
  return bul.sort(function(x,y){ return x[0]-y[0] || D.sirano[x[1]]-D.sirano[y[1]]; }).map(function(x){ return x[1]; });
}

    });
  });
  ekran.appendChild(h("p",{class:kayitTamam?"durum":"bilgi uyari",text:kayitTamam? "Seçimleriniz bu telefonda kayıtlı ✓" : "Seçimler bu telefonda kaydedilemedi. Sayfayı kapatmadan listenizi gönderin."}));
  sayac();
  if(koru) window.scrollTo(0,y);
}

function ciz(){
  if(!D) return;

  else if(hs==="ara") aramaEkran();
  else anaEkran();
  sayac(); sonKonum();
}

});

}).catch(function(){ temizle(); ekran.appendChild(h("p",{class:"bos",text:"Liste yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin."})); });
